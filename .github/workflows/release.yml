# Push a tag like v0.1.2 and this does the rest: checks the tag matches the
# version the code announces, builds the image for amd64 and arm64, pushes
# both under the version number and under "latest", and opens the GitHub
# release with notes generated from the commits. Nothing here needs a secret
# beyond the token GitHub hands every workflow.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be the version the code announces
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)"
          nas="$(sed -n 's/.*trance-autodj:\([0-9][^ ]*\).*/\1/p' deploy/docker-compose.nas.yml)"
          echo "tag=$tag code=$code nas-compose=$nas"
          test "$tag" = "$code" || { echo "tag $tag != app/__init__.py $code"; exit 1; }
          test "$tag" = "$nas"  || { echo "tag $tag != deploy/docker-compose.nas.yml $nas"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: WITH_CUDA=0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag without the leading v
        run: |
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:$v" \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"

      - name: Open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Trance AutoDJ ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Image: \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}\` (amd64 + arm64). The starter pack of video blocks lives on the [v0.1.0 release](https://github.com/${{ github.repository }}/releases/tag/v0.1.0) and does not change between versions."
