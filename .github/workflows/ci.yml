# Every push and pull request: lint, format check, and the full test suite —
# inside the same image that ships, so what passes here is what runs there.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (amd64, cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: WITH_CUDA=0
          load: true
          tags: trance-autodj:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint, format, test
        # --user root: the image runs as its own unprivileged user, who
        # cannot install the dev tools into /opt/venv. This container is
        # thrown away after the run, so root costs nothing here.
        run: |
          docker run --rm --user root -v "$PWD":/src -w /src trance-autodj:ci sh -c '
            pip install -q -r requirements-dev.txt &&
            ruff check app tests scripts &&
            black --check app tests scripts &&
            python -m pytest -q'
