{% extends "base.html" %}
{% block title %}Logs — Trance AutoDJ{% endblock %}

{% block content %}
  <div class="toolbar">
    <select id="service"></select>
    <select id="level">
      <option value="">all levels</option>
      <option value="info">info and above</option>
      <option value="warning">warnings and errors</option>
      <option value="error">errors only</option>
    </select>
    <button class="mini" id="follow">following ●</button>
    <button class="mini" id="clear">clear</button>
    <span class="grow"></span>
    <span id="count" style="font-family:var(--mono);font-size:.74rem;color:var(--text-faint)"></span>
  </div>

  <section class="card">
    <header>log</header>
    <div id="out" style="max-height:34rem;overflow:auto;padding:.5rem 0"></div>
  </section>
{% endblock %}

{% block scripts %}
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const COLOR = { debug: 'var(--text-faint)', info: 'var(--text-dim)',
                warning: 'var(--warn)', error: 'var(--red)', critical: 'var(--red)' };
const RANK = { debug: 0, info: 1, warning: 2, error: 3, critical: 3 };

let source = null;
let following = true;
let shown = 0;

function line(e) {
  const wanted = $('level').value;
  if (wanted && (RANK[e.level] ?? 1) < RANK[wanted]) return;
  const extra = e.extra && Object.keys(e.extra).length
    ? ` <span style="color:var(--violet)">${esc(JSON.stringify(e.extra))}</span>` : '';
  const div = document.createElement('div');
  div.style.cssText = 'font-family:var(--mono);font-size:.74rem;padding:.12rem .85rem;' +
    'white-space:pre-wrap;word-break:break-word;color:' + (COLOR[e.level] || 'var(--text-dim)');
  div.innerHTML =
    `<span style="color:var(--text-faint)">${esc((e.ts || '').slice(11, 19))}</span> ` +
    `<span style="color:var(--cyan)">${esc(e.logger.split('.').pop())}</span> ` +
    esc(e.msg) + extra + (e.exc ? `\n${esc(e.exc)}` : '');
  $('out').appendChild(div);
  shown += 1;
  // Keep the DOM bounded; a 24/7 log would otherwise eat the browser.
  while ($('out').childElementCount > 2000) $('out').removeChild($('out').firstChild);
  $('count').textContent = `${shown} lines`;
  if (following) $('out').scrollTop = $('out').scrollHeight;
}

async function connect() {
  if (source) { source.close(); source = null; }
  $('out').innerHTML = '';
  shown = 0;
  const service = $('service').value;
  if (!service) return;

  const history = await (await fetch(`/api/logs/${service}?lines=300`)).json();
  history.entries.forEach(line);

  source = new EventSource(`/api/logs/${service}/stream`);
  source.onmessage = (event) => line(JSON.parse(event.data));
  source.onerror = () => { /* EventSource reconnects by itself */ };
}

$('follow').addEventListener('click', () => {
  following = !following;
  $('follow').textContent = following ? 'following ●' : 'paused ○';
  $('follow').classList.toggle('on', following);
});
$('clear').addEventListener('click', () => { $('out').innerHTML = ''; shown = 0; });
$('service').addEventListener('change', connect);
$('level').addEventListener('change', connect);

fetch('/api/logs/services').then((r) => r.json()).then((d) => {
  $('service').innerHTML = d.services.map((s) =>
    `<option value="${s.name}">${s.name} (${s.size_kb} KB)</option>`).join('')
    || '<option value="">no logs yet</option>';
  connect();
});
</script>
{% endblock %}
